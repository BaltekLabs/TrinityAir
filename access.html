<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinity Air Link — Secure Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 15% 15%, #dbeafe 0%, #f4f7fb 40%, #f8fafc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.05em;
        }
        .card {
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.1);
            border-radius: 16px;
            box-shadow: 0 20px 48px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(10, 111, 255, 0.06);
        }
        .input-field {
            width: 100%;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            background: #f8fafc;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .input-field:focus {
            border-color: #0a6fff;
            box-shadow: 0 0 0 3px rgba(10, 111, 255, 0.12);
            background: #ffffff;
        }
        .input-field.error {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        .btn-primary {
            width: 100%;
            background: #0a6fff;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 13px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            letter-spacing: 0.02em;
        }
        .btn-primary:hover {
            background: #0058d6;
            box-shadow: 0 4px 16px rgba(10, 111, 255, 0.3);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-primary:disabled {
            background: #93c5fd;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .lock-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 100%);
            border: 1.5px solid rgba(10, 111, 255, 0.2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .error-msg {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
            align-items: center;
            gap: 6px;
        }
        .error-msg.visible {
            display: flex;
        }
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(15, 23, 42, 0.08), transparent);
            margin: 28px 0;
        }
    </style>
</head>
<body>
    <div style="width: 100%; max-width: 440px; padding: 24px;">
        <!-- Logo -->
        <div style="text-align: center; margin-bottom: 32px;">
            <a href="index.html" style="text-decoration: none;">
                <span class="logo" style="font-size: 1.1rem; font-weight: 700; color: #0a6fff; letter-spacing: 0.12em;">
                    TRINITY AIR LINK
                </span>
            </a>
        </div>

        <!-- Card -->
        <div class="card" style="padding: 40px 36px;">
            <div class="lock-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="11" width="14" height="10" rx="2" stroke="#0a6fff" stroke-width="1.8"/>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="#0a6fff" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="12" cy="16" r="1.5" fill="#0a6fff"/>
                </svg>
            </div>

            <h1 style="font-size: 1.35rem; font-weight: 700; color: #0f172a; text-align: center; margin-bottom: 8px;">
                Restricted Access
            </h1>
            <p style="font-size: 0.9rem; color: #64748b; text-align: center; margin-bottom: 28px; line-height: 1.6;">
                This document is for authorized recipients only. Enter your access password to continue.
            </p>

            <div class="divider"></div>

            <form id="accessForm" autocomplete="off">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #334155; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px;">
                    Access Password
                </label>
                <input
                    id="passwordInput"
                    class="input-field"
                    type="password"
                    placeholder="Enter password"
                    autocomplete="off"
                    spellcheck="false"
                />
                <div class="error-msg" id="errorMsg">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="10" stroke="#dc2626" stroke-width="2"/>
                        <path d="M12 8v4M12 16h.01" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Incorrect password. Please try again.
                </div>

                <button type="submit" class="btn-primary" id="submitBtn" style="margin-top: 20px;">
                    Access Document
                </button>
            </form>

            <div class="divider"></div>

            <p style="font-size: 0.8rem; color: #94a3b8; text-align: center; line-height: 1.6;">
                Don't have access?
                <a href="index.html#contact" style="color: #0a6fff; font-weight: 600; text-decoration: none;">Request credentials</a>
            </p>
        </div>

        <!-- Footer -->
        <p style="text-align: center; font-size: 0.75rem; color: #94a3b8; margin-top: 24px;">
            <a href="index.html" style="color: #64748b; text-decoration: none;">← Back to main site</a>
        </p>
    </div>

    <script>
        const EXPECTED = 'c7a545be42d4f639fbc2f744406e37a97bc2089f7d3c20ee14aa03096e7c363c';
        const KEY = 'ta_access';

        // If already authenticated, go home
        if (sessionStorage.getItem(KEY) === EXPECTED) {
            window.location.replace(getReturnUrl());
        }

        function getReturnUrl() {
            const params = new URLSearchParams(window.location.search);
            const ret = params.get('return');
            if (ret && ret.startsWith('/') && !ret.startsWith('//')) return ret;
            return 'index.html';
        }

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        document.getElementById('accessForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const input = document.getElementById('passwordInput');
            const btn = document.getElementById('submitBtn');
            const errMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.textContent = 'Verifying…';
            input.classList.remove('error');
            errMsg.classList.remove('visible');

            const hash = await hashPassword(input.value.trim());

            if (hash === EXPECTED) {
                sessionStorage.setItem(KEY, EXPECTED);
                window.location.replace(getReturnUrl());
            } else {
                input.classList.add('error');
                errMsg.classList.add('visible');
                btn.disabled = false;
                btn.textContent = 'Access Document';
                input.value = '';
                input.focus();
            }
        });

        document.getElementById('passwordInput').addEventListener('input', function () {
            this.classList.remove('error');
            document.getElementById('errorMsg').classList.remove('visible');
        });
    </script>
</body>
</html>
